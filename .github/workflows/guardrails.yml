name: guardrails

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  file-size-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file-size guard
        run: bash scripts/check-file-size-guard.sh

  go-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Run Go release checklist
        run: bash scripts/run-go-checklist.sh
